apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-project2
  labels:
    app: project2
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: project2
  template:
    metadata:
      labels:
        app: project2
    spec:
      containers:
        - name: project2
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port | quote }}"